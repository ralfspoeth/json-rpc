# JUL configuration for tests.
# System.Logger level mapping: ERROR->SEVERE, WARNING->WARNING,
# INFO->INFO, DEBUG->FINE, TRACE->FINER.

handlers = java.util.logging.ConsoleHandler
.level = INFO

# Enable all levels only for our own code (the weaver logs under the target class name).
io.github.ralfspoeth.level = ALL

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Compact one-line format: time  LEVEL  logger - message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL  %4$-12s: %3$s; %5$s%6$s%n
